<svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1557b0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#gradient)"/>

  <!-- Pipeline stages (simplified representation) -->
  <g fill="white">
    <!-- Three columns representing pipeline stages -->
    <rect x="24" y="35" width="18" height="58" rx="3"/>
    <rect x="55" y="35" width="18" height="58" rx="3"/>
    <rect x="86" y="35" width="18" height="58" rx="3"/>

    <!-- Deal cards in each stage -->
    <rect x="27" y="38" width="12" height="8" rx="1" fill="#4285f4"/>
    <rect x="27" y="48" width="12" height="8" rx="1" fill="#4285f4"/>

    <rect x="58" y="38" width="12" height="8" rx="1" fill="#34a853"/>
    <rect x="58" y="48" width="12" height="8" rx="1" fill="#34a853"/>
    <rect x="58" y="58" width="12" height="8" rx="1" fill="#34a853"/>

    <rect x="89" y="38" width="12" height="8" rx="1" fill="#fbbc04"/>
  </g>

  <!-- Envelope icon overlay (representing Gmail) -->
  <g transform="translate(44, 84)">
    <rect x="0" y="0" width="40" height="28" rx="2" fill="white"/>
    <path d="M 0 0 L 20 14 L 40 0" stroke="#1a73e8" stroke-width="2" fill="none"/>
  </g>
</svg>
