<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #autocomplete-input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e8eaed;
      border-radius: 8px;
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      box-sizing: border-box;
      transition: border-color 0.2s ease;
    }
    #autocomplete-input:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 1px 6px rgba(26, 115, 232, 0.3);
    }
    #autocomplete-input::placeholder {
      color: #80868b;
    }
  </style>
</head>
<body>
  <input type="text" id="autocomplete-input" placeholder="Search for hospital, clinic, or medical facility..." autocomplete="off" />
  <script src="institution-autocomplete.js"></script>
</body>
</html>
